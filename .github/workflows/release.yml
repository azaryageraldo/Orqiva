name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  FRANKENPHP_VERSION: v1.13.1

jobs:
  publish-runtimes:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            asset: frankenphp-linux-x86_64
          - platform: linux
            arch: arm64
            asset: frankenphp-linux-aarch64
          - platform: darwin
            arch: arm64
            asset: frankenphp-mac-arm64
          - platform: darwin
            arch: x64
            asset: frankenphp-mac-x86_64
          - platform: win32
            arch: x64
            asset: frankenphp-windows-x86_64.zip
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Sync package version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build runtime package
        run: |
          node scripts/build-runtime-package.mjs \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --url https://github.com/php/frankenphp/releases/download/${{ env.FRANKENPHP_VERSION }}/${{ matrix.asset }} \
            --output build/runtimes
      - name: Publish runtime package
        run: npm publish "build/runtimes/orqiva-runtime-${{ matrix.platform }}-${{ matrix.arch }}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    name: Publish orqiva
    needs: publish-runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Sync package version
        working-directory: packages/cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          for package in \
            orqiva-runtime-darwin-arm64 \
            orqiva-runtime-darwin-x64 \
            orqiva-runtime-linux-arm64 \
            orqiva-runtime-linux-x64 \
            orqiva-runtime-win32-x64
          do
            npm pkg set "optionalDependencies.$package=$VERSION"
          done
      - name: Build and publish CLI package
        working-directory: packages/cli
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: publish-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
