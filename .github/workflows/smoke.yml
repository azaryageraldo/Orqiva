name: Runtime smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  artifacts:
    name: Verifikasi binary runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unduh paket runtime dan periksa format binary
        run: |
          set -euo pipefail
          mkdir -p runtime-check
          cd runtime-check
          check() {
            package="$1"
            pattern="$2"
            label="$3"
            npm pack "$package@0.1.0" --silent > tarball.txt
            tarball=$(cat tarball.txt | tail -n 1)
            tar -xzf "$tarball"
            file package/frankenphp* | tee "$label.txt"
            if ! grep -qE "$pattern" "$label.txt"; then
              echo "::error::$label tidak sesuai pola $pattern"
              exit 1
            fi
            rm -rf package "$tarball"
          }
          check orqiva-runtime-linux-x64 "ELF 64-bit.*x86-64" linux-x64
          check orqiva-runtime-linux-arm64 "ELF 64-bit.*ARM aarch64" linux-arm64
          check orqiva-runtime-darwin-arm64 "Mach-O 64-bit.*arm64" darwin-arm64
          check orqiva-runtime-darwin-x64 "Mach-O 64-bit.*x86_64" darwin-x64
          check orqiva-runtime-win32-x64 "PE32\+ executable" win32-x64

  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and inspect published package
        env:
          ORQIVA_DATA_DIR: ${{ runner.temp }}/orqiva-data
        run: |
          npx --yes orqiva@0.1.0 help
          set +e
          npx --yes orqiva@0.1.0 doctor > doctor.txt 2>&1
          code=$?
          cat doctor.txt
          if ! grep -q "Runtime PHP: FrankenPHP" doctor.txt; then
            echo "::error::Runtime FrankenPHP tidak terdeteksi di ${{ matrix.os }}"
            exit 1
          fi
          if ! grep -q "Runtime aplikasi" doctor.txt; then
            echo "::error::Runtime aplikasi tidak ditemukan di ${{ matrix.os }}"
            exit 1
          fi
          echo "doctor exit code: $code (kode 1 wajar bila database belum dibuat)"
