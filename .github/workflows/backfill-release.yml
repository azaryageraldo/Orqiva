name: Backfill release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Orqiva v0.1.0
          generate_release_notes: true
